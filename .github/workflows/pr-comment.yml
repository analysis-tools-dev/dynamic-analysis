name: PR Check Comment

on:
  workflow_run:
    workflows: ["CI", "PR Check"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    steps:
      # No checkout: artifacts are untrusted text, never code or comment targets.
      - name: Resolve associated PR
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run.head_repository?.id || !run.head_sha) {
              core.notice('Missing run head identity. Skipping comment.');
              return;
            }
            const matchesRun = pr =>
              pr.state === 'open' &&
              pr.base?.repo?.id === context.payload.repository.id &&
              pr.head?.sha === run.head_sha &&
              pr.head?.repo?.id === run.head_repository.id;
            let candidates;
            if (run.pull_requests?.length) {
              candidates = await Promise.all(run.pull_requests.map(async pr => {
                const {data} = await github.rest.pulls.get({
                  ...context.repo, pull_number: pr.number
                });
                return data;
              }));
            } else {
              // Fork runs can omit pull_requests. Only GitHub's API may supply
              // fallback targets; a shared commit alone does not identify a fork.
              candidates = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit, {
                  ...context.repo, commit_sha: run.head_sha, per_page: 100
                });
            }
            const prs = candidates.filter(matchesRun);
            if (prs.length !== 1) {
              core.notice('No unique open PR matches the run head and repositories. Skipping comment.');
              return;
            }
            // Recheck current state after discovery, including API fallback results.
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: prs[0].number
            });
            if (!matchesRun(pr)) {
              core.notice('PR no longer matches the run. Skipping comment.');
              return;
            }
            core.setOutput('number', pr.number);

      - name: Download feedback
        if: steps.target.outputs.number != ''
        uses: actions/download-artifact@v4
        with:
          # Unlike name, pattern succeeds with zero artifacts (normal for passing CI).
          pattern: ${{ github.event.workflow_run.name == 'PR Check' && 'pr-check-output' || 'ci-*-output' }}
          path: ${{ runner.temp }}/feedback
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Post or update feedback
        if: steps.target.outputs.number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.target.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const run = context.payload.workflow_run;
            const names = run.name === 'PR Check'
              ? ['pr-check-output'] : ['ci-readme-output', 'ci-render-output'];
            const feedback = names.map(name => ({
              name, file: path.join(process.env.RUNNER_TEMP, 'feedback', name, 'comment.md')
            })).filter(({file}) => fs.existsSync(file));
            if (!feedback.length) {
              core.notice('No feedback artifacts were produced. Nothing to comment.');
              return;
            }
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100
            });
            for (const {name, file} of feedback) {
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.size > 60000) {
                core.warning(`Ignoring invalid or oversized feedback from ${name}`);
                continue;
              }
              const text = fs.readFileSync(file, 'utf8').trim();
              if (!text) continue;
              const marker = `<!-- dynamic-analysis-${name} -->`;
              const body = `${marker}\n${text}\n\n[Workflow logs](${run.html_url})`;
              const existing = comments.find(c =>
                c.user.login === 'github-actions[bot]' && c.user.type === 'Bot' &&
                c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo, comment_id: existing.id, body
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number, body
                });
              }
            }
